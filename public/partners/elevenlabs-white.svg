<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 42" role="img" aria-label="ElevenLabs">
  <!-- Знак «11»: дві риски заввишки з великі літери (cap-height), тонкі, як на elevenlabs.io -->
  <rect x="0"  y="8" width="5" height="26" rx="0.8" fill="#ffffff"/>
  <rect x="10" y="8" width="5" height="26" rx="0.8" fill="#ffffff"/>
  <!-- Вордмарк впритул до знака -->
  <text x="22" y="34"
        font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.6"
        fill="#ffffff">ElevenLabs</text>
</svg>

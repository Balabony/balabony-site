<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 48" role="img" aria-label="ElevenLabs">
  <!-- Знак «11»: дві вертикальні риски на ПОВНУ висоту лого (вищі за слово) -->
  <rect x="0"  y="0" width="9" height="48" rx="1.5" fill="#ffffff"/>
  <rect x="18" y="0" width="9" height="48" rx="1.5" fill="#ffffff"/>
  <!-- Вордмарк: нижчий за знак, звужений, впритул до знака -->
  <text x="36" y="38"
        font-family="'Arial Narrow','Helvetica Neue Condensed',Arial,sans-serif"
        font-size="34" font-weight="700" font-stretch="condensed"
        letter-spacing="-0.5" fill="#ffffff">ElevenLabs</text>
</svg>
